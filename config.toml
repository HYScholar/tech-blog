baseURL = "https://HYScholar.github.io/tech-blog/"
languageCode = "zh-CN"
title = "Team Tech Blog"
# theme = ""  # 使用自定义 layouts，无需外部主题

[params]
  description = "团队技术博客"
  author = "Team"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = [":git", "lastmod", "date", "publishDate"]
